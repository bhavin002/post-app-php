<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Post App</title>

    <link rel="stylesheet" href="/src/assets/css/main.css">

</head>

<body>

    <main class="container min-vh-100 d-flex align-items-center py-4">

        <div class="row w-100 justify-content-center mx-0">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Create Account
                        </h2>

                        <div id="alert-container"></div>

                        <form id="register-form">

                            <div class="mb-3">

                                <label class="form-label">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    maxlength="100"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    maxlength="150"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <button
                                class="btn btn-primary w-100"
                                type="submit"
                            >
                                Register
                            </button>

                        </form>

                        <div class="text-center mt-3">

                            <a href="/login.html">
                                Already have an account?
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script
        type="module"
        src="/src/pages/register/register.js"
    ></script>

</body>

</html>
